<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>PulseVoice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140B29; color: #fff;
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  body { display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box;
    border: 1px solid #391E6D; border-radius: 10px; -webkit-app-region: drag; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: #B9A8E6; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; border: 0; border-radius: 8px; padding: 8px 10px; color: #fff; cursor: pointer;
    background: #391E6D; font: inherit; font-weight: 600; }
  button:hover { background: #4a2a8a; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button.on { background: #fff; color: #140B29; }
  button.danger { background: #C62F4B; }
  button.danger:hover { background: #dc3a58; }
  button.ok { background: #1E9E5A; }
  button.ok:hover { background: #25b869; }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <div class="who">
    <div class="name" id="name"></div>
    <div class="sub" id="sub"></div>
  </div>
  <button id="answer" class="ok" hidden></button>
  <button id="mute"></button>
  <button id="hangup" class="danger"></button>
  <script src="mini.js"></script>
</body>
</html>
