<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>PulseVoice</title>
<style>
  html, body { margin: 0; height: 100%; background: #140B29; color: #fff; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; box-sizing: border-box; padding: 18px 20px 14px; gap: 12px; }
  h1 { margin: 0; font-size: 17px; }
  .tabs { display: flex; gap: 8px; }
  .tab { border: 1px solid #391E6D; background: transparent; color: #B9A8E6; border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 600; }
  .tab[aria-selected="true"] { background: #391E6D; color: #fff; }
  .grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-content: start; padding: 2px; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; border: 2px solid transparent; background: #1f1340; color: inherit; cursor: pointer; font: inherit; text-align: start; }
  .card:hover { background: #2a1a55; }
  .card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .card[aria-checked="true"] { border-color: #fff; }
  .thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #0b0617; border-radius: 6px; }
  .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name img { width: 16px; height: 16px; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .empty { color: #B9A8E6; padding: 24px; }
  .foot { display: flex; align-items: center; gap: 10px; }
  .foot label { flex: 1; color: #B9A8E6; display: flex; align-items: center; gap: 6px; }
  .foot label[hidden] { display: none; }
  button.act { border: 0; border-radius: 8px; padding: 9px 16px; color: #fff; background: #391E6D; cursor: pointer; font: inherit; font-weight: 700; }
  button.act:hover:not(:disabled) { background: #4a2a8a; }
  button.act.primary { background: #1E9E5A; }
  button.act.primary:hover:not(:disabled) { background: #25b869; }
  button.act:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="grid" role="radiogroup" id="grid"></div>
  <div class="foot">
    <label id="audioLabel" hidden><input type="checkbox" id="audio"><span id="audioText"></span></label>
    <span style="flex:1"></span>
    <button class="act" id="cancel"></button>
    <button class="act primary" id="share" disabled></button>
  </div>
  <script src="share-picker-page.js"></script>
</body>
</html>
